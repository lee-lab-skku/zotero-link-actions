version = 1

# The last matching annotation applies, so the skill and configuration
# override the project default. Files with their own SPDX headers keep them.

[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "2025-2026 Advanced Additive Manufacturing Systems Laboratory, Sungkyunkwan University"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["skills/zot-jot/**"]
SPDX-FileCopyrightText = "2025-2026 Advanced Additive Manufacturing Systems Laboratory, Sungkyunkwan University"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [".coveragerc", ".gitattributes", ".gitignore", ".github/**", "REUSE.toml"]
SPDX-FileCopyrightText = "2025-2026 Advanced Additive Manufacturing Systems Laboratory, Sungkyunkwan University"
SPDX-License-Identifier = "CC0-1.0"
